name: Deployment smoke

on:
  workflow_run:
    workflows: ["Platform quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# An older completion must never cancel the newer revision's verification.
concurrency:
  group: deployment-smoke-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  deployed-surfaces:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # workflow_run's GITHUB_SHA can be newer than the quality-checked revision.
      SMOKE_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the quality-checked revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SMOKE_EXPECTED_SHA }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify smoke validator regressions
        run: node --test ops/deployment-smoke.test.mjs

      - name: Verify exact Render and Vercel revisions and deployed access boundaries
        run: node ops/deployment-smoke.mjs
